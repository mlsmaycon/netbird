name: Fork images

# Builds the server images from source and pushes them to this fork's GitHub
# packages (ghcr.io/<owner>/<image>), tagged with the branch name and commit.
# The release workflow publishes to netbirdio's registries with secrets a fork
# does not have; this one only needs the workflow's own GITHUB_TOKEN.

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms (management and netbird-server compile with cgo, so arm64 builds under emulation and is slow)"
        required: false
        default: "linux/amd64"

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: ${{ matrix.image }}
    # Never runs upstream: the images belong to the fork's own packages.
    if: github.repository_owner == 'mlsmaycon'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: netbird-management
            dockerfile: management/Dockerfile.multistage
          - image: netbird-proxy
            dockerfile: proxy/Dockerfile.multistage
          - image: netbird-server
            dockerfile: combined/Dockerfile.multistage
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # netbird-server stamps its version from git describe.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up QEMU
        if: contains(inputs.platforms, 'arm')
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          IMAGE_NAME: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          PLATFORMS: ${{ inputs.platforms || 'linux/amd64' }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/${IMAGE_NAME}"
          # Branch names may hold characters a tag cannot: claude/foo -> claude-foo.
          branch_tag="$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9_.-]/-/g' -e 's/^[.-]*//' | cut -c1-120)"
          short_sha="${GITHUB_SHA::7}"

          tags=(--tag "${image}:${branch_tag}" --tag "${image}:sha-${short_sha}")
          if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            tags+=(--tag "${image}:latest")
          fi

          docker buildx build \
            --file "$DOCKERFILE" \
            --platform "$PLATFORMS" \
            "${tags[@]}" \
            --label "org.opencontainers.image.source=https://github.com/${REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --cache-from "type=registry,ref=${image}:buildcache" \
            --cache-to "type=registry,ref=${image}:buildcache,mode=max" \
            --push \
            .

          {
            echo "### ${IMAGE_NAME}"
            echo '```'
            echo "${image}:${branch_tag}"
            echo "${image}:sha-${short_sha}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
